version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: threatguard-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./threatguard.db
      - SECRET_KEY=threatguard-super-secret-key-enterprise-soc-2026
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ABUSEIPDB_API_KEY=${ABUSEIPDB_API_KEY:-}
      - URLHAUS_API_KEY=${URLHAUS_API_KEY:-}
      - ENVIRONMENT=production
    volumes:
      - ./backend/threatguard.db:/app/threatguard.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: threatguard-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    depends_on:
      - backend
    restart: unless-stopped
